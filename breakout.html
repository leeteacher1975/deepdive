<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Breakout Canvas · ZA2030 딥다이브세션</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --blue-dark:#1D4E89;
    --blue:#2D6CDF;
    --ink:#14213D;
    --sub:#5B6B85;
    --bg:#EEF3FB;
    --card:#FFFFFF;
    --line:#DCE5F5;
    --c-customer:#2D6CDF;
    --c-speed:#E5822B;
    --c-global:#2FA365;
    --c-hpt:#8B5CF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Pretendard","-apple-system",BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }

  .flow-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px 14px;
    background:#fff;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .flow-tab{
    font-size:13px;
    font-weight:700;
    color:var(--sub);
    text-decoration:none;
    padding:7px 14px;
    border-radius:999px;
    background:#F1F5FC;
  }
  .flow-tab.active{ background:var(--blue-dark); color:#fff; }
  .flow-arrow{ color:var(--sub); font-size:13px; }

  .header{
    background:linear-gradient(135deg,var(--blue-dark),var(--blue));
    color:#fff;
    padding:26px 20px 30px;
    text-align:center;
  }
  .header .badge{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    background:rgba(255,255,255,0.18);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .header h1{ margin:0 0 6px; font-size:clamp(19px,3vw,26px); font-weight:800; }
  .header p{ margin:0; font-size:14px; opacity:0.9; }

  .tabbar{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:16px 14px 0;
  }
  .tabbar button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:10px 18px;
    min-height:44px;
    border-radius:12px 12px 0 0;
    border:1px solid var(--line);
    border-bottom:none;
    background:#F1F5FC;
    color:var(--sub);
    cursor:pointer;
  }
  .tabbar button.active{ background:var(--card); color:var(--blue-dark); }

  .panel{
    max-width:1020px;
    margin:0 auto;
    padding:20px 18px 50px;
  }

  /* 작성하기 */
  .element-picker{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
  }
  @media (max-width:700px){
    .element-picker{ grid-template-columns:repeat(2,1fr); }
  }
  .element-btn{
    font-family:inherit;
    font-size:14px;
    font-weight:800;
    padding:14px 10px;
    min-height:56px;
    border-radius:14px;
    border:2px solid var(--line);
    background:#fff;
    color:var(--el-color, var(--blue-dark));
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .element-btn:active{ transform:scale(0.97); }
  .element-btn.selected{
    background:var(--el-color, var(--blue-dark));
    color:#fff;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);
  }

  .empty-hint{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    padding:30px 10px;
  }

  .canvas{ display:none; }
  .canvas.show{ display:block; }

  .mission{
    background:#fff;
    border-radius:18px;
    border:1px solid var(--line);
    border-left:6px solid var(--el-color, var(--blue-dark));
    padding:18px 22px;
    font-size:16px;
    font-weight:700;
    line-height:1.6;
    margin-bottom:18px;
  }
  .mission b{ color:var(--el-color, var(--blue-dark)); }

  .participants-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--el-color, var(--blue-dark));
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .participants-card label{
    display:block;
    font-size:13px;
    font-weight:800;
    color:var(--el-color, var(--blue-dark));
    margin-bottom:8px;
  }
  .participants-card textarea{
    width:100%;
    min-height:52px;
    resize:vertical;
    font-family:inherit;
    font-size:14px;
    line-height:1.5;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--ink);
  }
  .participants-card textarea:focus{ outline:2px solid var(--el-color, var(--blue)); outline-offset:1px; }

  .quad-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:700px){
    .quad-grid{ grid-template-columns:1fr; }
  }
  .quad-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--el-color, var(--blue-dark));
    border-radius:14px;
    padding:14px 16px;
  }
  .quad-card .quad-title{ font-size:13px; font-weight:800; color:var(--el-color, var(--blue-dark)); margin-bottom:2px; }
  .quad-card .quad-q{ font-size:12.5px; color:var(--sub); margin-bottom:8px; }
  .quad-card textarea{
    width:100%;
    min-height:90px;
    resize:vertical;
    font-family:inherit;
    font-size:14px;
    line-height:1.5;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    color:var(--ink);
  }
  .quad-card textarea:focus{ outline:2px solid var(--el-color, var(--blue)); outline-offset:1px; }
  .quad-status{
    font-size:11.5px;
    color:var(--sub);
    margin-top:6px;
    min-height:14px;
    text-align:right;
  }

  .save-status{
    text-align:center;
    font-size:12.5px;
    color:var(--sub);
    margin-top:14px;
    min-height:16px;
  }

  /* 함께 보기 */
  .together-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  @media (max-width:900px){
    .together-grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:480px){
    .together-grid{ grid-template-columns:1fr; }
  }
  .together-col{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .together-col .col-head{
    padding:12px 14px;
    color:#fff;
    font-weight:800;
    font-size:13px;
    background:var(--el-color, var(--blue-dark));
  }
  .together-col .col-body{ padding:12px 14px; }
  .together-col .mini-q{ font-size:11.5px; font-weight:800; color:var(--el-color, var(--blue-dark)); margin:10px 0 2px; }
  .together-col .mini-q:first-child{ margin-top:0; }
  .together-col .mini-v{ font-size:13px; line-height:1.5; color:var(--ink); white-space:pre-wrap; word-break:break-word; }
  .together-col .mini-v.empty{ color:var(--sub); font-style:italic; }
  .together-col .updated{ font-size:11px; color:var(--sub); margin-top:10px; text-align:right; }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--sub);
    padding:10px 12px 30px;
  }
</style>
</head>
<body>

  <div class="flow-nav">
    <a href="index.html" id="flowLive" class="flow-tab">① Live Poll</a>
    <span class="flow-arrow">→</span>
    <a href="breakout.html" class="flow-tab active">② Breakout Canvas</a>
    <span class="flow-arrow">→</span>
    <a href="clustering.html" id="flowClustering" class="flow-tab">③ Clustering Matrix</a>
    <span class="flow-arrow">→</span>
    <a href="prioritize.html" id="flowPrioritize" class="flow-tab">④ Prioritization</a>
    <span class="flow-arrow">→</span>
    <a href="actioncard.html" id="flowActioncard" class="flow-tab">⑤ Action Card</a>
  </div>

  <div class="header">
    <span class="badge">BREAKOUT CANVAS</span>
    <h1>4개 그룹 · 1개 그룹당 1개 Element</h1>
    <p>"이 요소를 우리 팀의 실제 업무에서 어떻게 살아 있게 만들 것인가?"</p>
  </div>

  <div class="tabbar">
    <button id="tabWriteBtn" class="active">작성하기</button>
    <button id="tabTogetherBtn">함께 보기</button>
  </div>

  <div class="panel">

    <div id="panelWrite">
      <div class="element-picker" id="elementPicker"></div>
      <div class="empty-hint" id="emptyHint">위에서 우리 그룹이 맡은 요소를 선택하세요</div>
      <div class="canvas" id="canvas">
        <div class="mission" id="missionText"></div>
        <div class="participants-card" id="participantsCard">
          <label for="participantsInput">참여자 (소속 · 이름)</label>
          <textarea id="participantsInput" placeholder="예: SSC IT팀 홍길동, 마케팅팀 김영희"></textarea>
          <div class="quad-status" id="participantsStatus"></div>
        </div>
        <div class="quad-grid" id="quadGrid"></div>
        <div class="save-status" id="saveStatus"></div>
      </div>
    </div>

    <div id="panelTogether" style="display:none;">
      <div class="together-grid" id="togetherGrid"></div>
      <div style="text-align:center;margin-top:18px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;">
        <button id="csvBtn" style="font-size:12px;color:var(--blue-dark);background:none;border:none;cursor:pointer;padding:10px;font-weight:700;text-decoration:underline;">CSV 다운로드</button>
        <button id="resetBtn" style="font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;padding:10px;text-decoration:underline;">관리자 · 전체 초기화</button>
      </div>
    </div>

  </div>

  <footer>© 2026 Joanna Lee. All rights reserved.</footer>

<script>
(function(){
  var ELEMENTS = [
    { id:'customer', label:'Customer at the Core', color:'var(--c-customer)' },
    { id:'speed', label:'Speed', color:'var(--c-speed)' },
    { id:'global', label:'Truly Global', color:'var(--c-global)' },
    { id:'hpt', label:'High-Performance Team ZEISS', color:'var(--c-hpt)' }
  ];
  var QUADS = [
    { key:'meaning', title:'A. MEANING', q:'우리 업무에서 이 요소는 무엇을 의미하는가?' },
    { key:'action', title:'B. ALREADY IN ACTION', q:'이미 잘하고 있는 구체적 사례는?' },
    { key:'change', title:'C. DO DIFFERENTLY', q:'더 잘 하기 위해 무엇을 다르게 할까?' },
    { key:'evidence', title:'D. EVIDENCE / EXAMPLE', q:'고객·프로세스·협업·의사결정 등 실제 장면/사례' }
  ];

  var elementPicker = document.getElementById('elementPicker');
  var emptyHint = document.getElementById('emptyHint');
  var canvasEl = document.getElementById('canvas');
  var missionText = document.getElementById('missionText');
  var participantsInput = document.getElementById('participantsInput');
  var participantsStatus = document.getElementById('participantsStatus');
  var quadGrid = document.getElementById('quadGrid');
  var saveStatus = document.getElementById('saveStatus');
  var togetherGrid = document.getElementById('togetherGrid');

  var ALL_FIELD_KEYS = ['participants'].concat(QUADS.map(function(q){ return q.key; }));

  function getFieldEl(key){
    if(key === 'participants') return participantsInput;
    return quadGrid.querySelector('textarea[data-key="'+key+'"]');
  }

  var tabWriteBtn = document.getElementById('tabWriteBtn');
  var tabTogetherBtn = document.getElementById('tabTogetherBtn');
  var panelWrite = document.getElementById('panelWrite');
  var panelTogether = document.getElementById('panelTogether');

  var LAST_ELEMENT_KEY = 'za2030_deepdive_breakout_element';
  var selectedId = localStorage.getItem(LAST_ELEMENT_KEY) || null;
  var saveTimers = {};   // 칸(key)별 자동저장 디바운스 타이머
  var dirty = {};        // 칸(key)별 "아직 저장 안 된 로컬 수정" 여부 — 동기화 시 덮어쓰지 않기 위함
  var pollTimer = null;  // 함께 보기 폴링
  var writeSyncTimer = null; // 작성하기 중 다른 사람 입력을 반영하는 폴링
  var currentTab = 'write';
  var lastTogetherElements = null; // CSV 다운로드용으로 마지막에 받아온 데이터 보관

  function findElement(id){
    for(var i=0;i<ELEMENTS.length;i++){ if(ELEMENTS[i].id === id) return ELEMENTS[i]; }
    return null;
  }

  // ---- 작성하기: 요소 선택 버튼 ----
  ELEMENTS.forEach(function(el){
    var btn = document.createElement('button');
    btn.className = 'element-btn';
    btn.style.setProperty('--el-color', el.color);
    btn.textContent = el.label;
    btn.dataset.id = el.id;
    btn.addEventListener('click', function(){ selectElement(el.id); });
    elementPicker.appendChild(btn);
  });

  participantsInput.addEventListener('input', function(){
    dirty.participants = true;
    setFieldStatus('participants', '입력 중...');
    if(saveTimers.participants) clearTimeout(saveTimers.participants);
    saveTimers.participants = setTimeout(function(){ saveField('participants'); }, 1200);
  });

  function refreshPickerHighlight(){
    var btns = elementPicker.querySelectorAll('.element-btn');
    btns.forEach(function(b){ b.classList.toggle('selected', b.dataset.id === selectedId); });
  }

  function buildCanvas(el){
    canvasEl.style.setProperty('--el-color', el.color);
    missionText.innerHTML = '“<b>' + el.label + '</b> 이 요소를 우리 팀의 실제 업무에서 어떻게 살아 있게 만들 것인가?”';
    quadGrid.innerHTML = '';
    QUADS.forEach(function(q){
      var card = document.createElement('div');
      card.className = 'quad-card';
      card.innerHTML =
        '<div class="quad-title">' + q.title + '</div>' +
        '<div class="quad-q">' + q.q + '</div>' +
        '<textarea data-key="' + q.key + '" placeholder="여기에 작성하세요"></textarea>' +
        '<div class="quad-status" data-status-key="' + q.key + '"></div>';
      quadGrid.appendChild(card);
    });
    quadGrid.querySelectorAll('textarea').forEach(function(ta){
      var key = ta.getAttribute('data-key');
      ta.addEventListener('input', function(){
        dirty[key] = true;
        setQuadStatus(key, '입력 중...');
        if(saveTimers[key]) clearTimeout(saveTimers[key]);
        saveTimers[key] = setTimeout(function(){ saveField(key); }, 1200);
      });
    });
  }

  function setQuadStatus(key, text){
    var el = quadGrid.querySelector('.quad-status[data-status-key="'+key+'"]');
    if(el) el.textContent = text;
  }

  function setFieldStatus(key, text){
    if(key === 'participants'){ participantsStatus.textContent = text; return; }
    setQuadStatus(key, text);
  }

  function fillCanvas(data){
    participantsInput.value = (data && data.participants) || '';
    QUADS.forEach(function(q){
      var ta = quadGrid.querySelector('textarea[data-key="'+q.key+'"]');
      if(ta) ta.value = (data && data[q.key]) || '';
    });
  }

  // 요소를 바꾸기 직전, 아직 저장 안 된(디바운스 대기 중) 칸이 있으면 예전 요소 쪽으로 먼저 저장해둠
  // (그렇지 않으면 타이머가 늦게 발화하면서 방금 고른 새 요소에 잘못 저장될 수 있음)
  function flushPendingSaves(oldId){
    if(!oldId) return;
    ALL_FIELD_KEYS.forEach(function(key){
      if(saveTimers[key]){
        clearTimeout(saveTimers[key]);
        saveTimers[key] = null;
      }
      if(dirty[key]){
        var el = getFieldEl(key);
        var value = el ? el.value : '';
        fetch('/api/breakout', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ element: oldId, field: key, value: value })
        }).catch(function(){});
      }
    });
  }

  function selectElement(id){
    var prevId = selectedId;
    if(prevId && prevId !== id){ flushPendingSaves(prevId); }
    selectedId = id;
    dirty = {};
    localStorage.setItem(LAST_ELEMENT_KEY, id);
    refreshPickerHighlight();
    var el = findElement(id);
    buildCanvas(el);
    emptyHint.style.display = 'none';
    canvasEl.classList.add('show');
    saveStatus.textContent = '불러오는 중...';
    fetch('/api/breakout').then(function(r){ return r.json(); }).then(function(data){
      var elements = (data && data.elements) || {};
      fillCanvas(elements[id]);
      saveStatus.textContent = elements[id] && elements[id].updatedAt ? '저장됨' : '';
    }).catch(function(){ saveStatus.textContent = ''; });
    startWriteSync();
  }

  // 칸(quadrant/참여자) 하나만 저장 — 같은 요소의 다른 칸을 동시에 다른 사람이 쓰고 있어도 서로 덮어쓰지 않음
  function saveField(key){
    if(!selectedId) return;
    var ta = getFieldEl(key);
    var value = ta ? ta.value : '';
    setFieldStatus(key, '저장 중...');
    fetch('/api/breakout', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ element: selectedId, field: key, value: value })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.ok){
        dirty[key] = false;
        setFieldStatus(key, '저장됨');
      } else {
        setFieldStatus(key, '저장 실패 — 다시 시도해주세요');
      }
    }).catch(function(){
      setFieldStatus(key, '네트워크 오류 — 다시 시도해주세요');
    });
  }

  // 작성하기 화면에 있는 동안, 내가 편집 중이 아닌 칸은 주기적으로 서버 최신 값으로 동기화
  // (같은 요소를 다른 그룹원이 다른 기기에서 동시에 편집 중일 때 실시간으로 보여주기 위함)
  function syncWriteFromServer(){
    if(!selectedId || currentTab !== 'write') return;
    fetch('/api/breakout').then(function(r){ return r.json(); }).then(function(data){
      var elements = (data && data.elements) || {};
      var el = elements[selectedId];
      if(!el) return;
      ALL_FIELD_KEYS.forEach(function(key){
        var ta = getFieldEl(key);
        if(!ta) return;
        var isFocused = document.activeElement === ta;
        if(isFocused || dirty[key]) return; // 편집 중이거나 저장 대기 중인 칸은 건드리지 않음
        var serverVal = el[key] || '';
        if(ta.value !== serverVal) ta.value = serverVal;
      });
    }).catch(function(){ /* 다음 주기에 재시도 */ });
  }

  function startWriteSync(){
    if(writeSyncTimer) clearInterval(writeSyncTimer);
    writeSyncTimer = setInterval(syncWriteFromServer, 3000);
  }
  function stopWriteSync(){
    if(writeSyncTimer) clearInterval(writeSyncTimer);
    writeSyncTimer = null;
  }

  if(selectedId){ selectElement(selectedId); }

  // ---- 함께 보기 ----
  function timeAgo(iso){
    if(!iso) return '';
    var diffMs = Date.now() - new Date(iso).getTime();
    var min = Math.floor(diffMs / 60000);
    if(min < 1) return '방금 업데이트';
    if(min < 60) return min + '분 전 업데이트';
    var hr = Math.floor(min/60);
    return hr + '시간 전 업데이트';
  }

  function renderTogether(elements){
    togetherGrid.innerHTML = '';
    ELEMENTS.forEach(function(el){
      var data = (elements && elements[el.id]) || {};
      var col = document.createElement('div');
      col.className = 'together-col';
      col.style.setProperty('--el-color', el.color);
      var participantsHtml =
        '<div class="mini-q">참여자</div>' +
        '<div class="mini-v' + (data.participants ? '' : ' empty') + '">' +
        (data.participants ? escapeHtml(data.participants) : '아직 입력 전') + '</div>';
      var body = QUADS.map(function(q){
        var v = data[q.key];
        return '<div class="mini-q">' + q.title + '</div>' +
          '<div class="mini-v' + (v ? '' : ' empty') + '">' + (v ? escapeHtml(v) : '아직 작성 전') + '</div>';
      }).join('');
      col.innerHTML =
        '<div class="col-head">' + el.label + '</div>' +
        '<div class="col-body">' + participantsHtml + body +
        '<div class="updated">' + timeAgo(data.updatedAt) + '</div></div>';
      togetherGrid.appendChild(col);
    });
  }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fetchTogether(){
    fetch('/api/breakout').then(function(r){ return r.json(); }).then(function(data){
      if(data && data.elements){
        lastTogetherElements = data.elements;
        renderTogether(data.elements);
      }
    }).catch(function(){ /* 다음 폴링에서 재시도 */ });
  }

  function startPolling(){
    fetchTogether();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(fetchTogether, 2000);
  }
  function stopPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      stopPolling();
      stopWriteSync();
    } else if(currentTab === 'together'){
      startPolling();
    } else if(currentTab === 'write' && selectedId){
      startWriteSync();
    }
  });

  // ---- 탭 전환 ----
  // "함께 보기"는 참가자도 자유롭게 볼 수 있는 공유 화면이라 비밀번호로 막지 않는다(관리자 초기화처럼
  // 실제로 민감한 동작은 그 버튼 자체에 별도 ADMIN_TOKEN 확인이 걸려 있어 이 탭 자체를 게이트할 필요가
  // 없음). "작성하기"도 참가자용이라 게이트 없음.
  // 플로우 탭은 URL이 ?tab=together로 명시적으로 지정되어 열린 경우(진행자 화면들이 이 방식으로 연결함)에만
  // 나머지 탭의 목적지를 진행자 화면(host/*.html)으로 바꿔준다. 참가자가 그냥 화면에서 "함께 보기" 버튼을
  // 눌러서 들어온 경우에는 참가자 화면 링크를 그대로 유지 — 그래야 참가자가 함께 보기를 본 뒤 다음 활동으로
  // 이동해도 진행자 화면으로 새지 않는다(2026-09-15 수정: 이전에는 이 탭에 진행자 비밀번호를 요구했는데,
  // 그 비밀번호를 아는 참가자가 한 번 통과하면 사이트 전체의 진행자 화면 접근 플래그가 로컬에 저장되어
  // 이후 다른 활동의 진행자 화면까지 비밀번호 없이 열리는 문제가 있었음 — 게이트 자체를 없애 근본적으로 해결).
  var enteredViaHostChain = (new URLSearchParams(window.location.search)).get('tab') === 'together';

  function updateFlowNav(tab){
    var isHost = tab === 'together' && enteredViaHostChain;
    document.getElementById('flowLive').href = isHost ? 'host/index.html' : 'index.html';
    document.getElementById('flowClustering').href = isHost ? 'host/clustering.html' : 'clustering.html';
    document.getElementById('flowPrioritize').href = isHost ? 'host/prioritize.html' : 'prioritize.html';
    document.getElementById('flowActioncard').href = isHost ? 'host/actioncard.html' : 'actioncard.html';
  }

  function showTab(tab){
    currentTab = tab;
    tabWriteBtn.classList.toggle('active', tab === 'write');
    tabTogetherBtn.classList.toggle('active', tab === 'together');
    panelWrite.style.display = tab === 'write' ? '' : 'none';
    panelTogether.style.display = tab === 'together' ? '' : 'none';
    updateFlowNav(tab);
    if(tab === 'together'){
      stopWriteSync();
      startPolling();
    } else {
      stopPolling();
      if(selectedId) startWriteSync();
    }
  }
  tabWriteBtn.addEventListener('click', function(){ showTab('write'); });
  tabTogetherBtn.addEventListener('click', function(){ showTab('together'); });

  // URL에 ?tab=together 를 붙이면 함께 보기 화면으로 바로 진입 (발표 화면용)
  var params = new URLSearchParams(window.location.search);
  if(params.get('tab') === 'together'){ showTab('together'); }

  // ---- CSV 다운로드 ----
  function csvEscape(v){
    var s = (v === null || v === undefined) ? '' : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  function downloadCsv(){
    var elements = lastTogetherElements;
    if(!elements){
      alert('아직 데이터를 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
      return;
    }
    var headers = ['요소', '참여자', 'Group Mission', 'A. MEANING', 'B. ALREADY IN ACTION', 'C. DO DIFFERENTLY', 'D. EVIDENCE / EXAMPLE', '마지막 업데이트'];
    var rows = [headers];
    ELEMENTS.forEach(function(el){
      var data = elements[el.id] || {};
      var mission = el.label + ' 이 요소를 우리 팀의 실제 업무에서 어떻게 살아 있게 만들 것인가?';
      rows.push([
        el.label,
        data.participants || '',
        mission,
        data.meaning || '',
        data.action || '',
        data.change || '',
        data.evidence || '',
        data.updatedAt || ''
      ]);
    });
    var csv = rows.map(function(row){ return row.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var now = new Date();
    var fname = 'breakout-canvas-' + now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate()) +
      '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + '.csv';
    var a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  document.getElementById('csvBtn').addEventListener('click', downloadCsv);

  document.getElementById('resetBtn').addEventListener('click', function(){
    var pw = window.prompt('관리자 비밀번호를 입력하세요');
    if(pw === null) return;
    if(!window.confirm('4개 요소의 모든 캔버스 내용을 초기화할까요? 이 작업은 되돌릴 수 없습니다.')) return;
    fetch('/api/breakout', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'reset', password: pw })
    }).then(function(r){ return r.json(); }).then(function(data){
      if(data && data.error === 'unauthorized'){
        alert('비밀번호가 올바르지 않습니다.');
      } else if(data && data.elements){
        lastTogetherElements = data.elements;
        renderTogether(data.elements);
      }
    });
  });
})();
</script>
</body>
</html>
